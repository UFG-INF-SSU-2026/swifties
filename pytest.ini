[pytest]
testpaths = tests
# integracao_apoio: fixtures dos testes de integração (não é conftest.py para não
# sombrear o `from conftest import ...` dos testes unitários)
pythonpath = tests/integracao
markers =
    integracao: exige Docker (broker Mosquitto + TimescaleDB reais); rode com `pytest -m integracao`
addopts = -q -p integracao_apoio -m "not integracao"
