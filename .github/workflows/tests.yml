name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt && pytest
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd dashboard && npm ci && npm test
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd mobile && npm ci --legacy-peer-deps && npx jest
  integracao:
    # broker Mosquitto + TimescaleDB reais (Docker) e consumidor como processo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: mkdir -p evidencias && pytest -m integracao -v -rxs --junitxml=evidencias/integracao.xml | tee evidencias/integracao.log
        shell: bash
        env: { PYTHONUNBUFFERED: '1' }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-integracao
          path: evidencias/
