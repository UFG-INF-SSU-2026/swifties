# Broker MQTT do Marco 2 (sem autenticacao: prototipo) + tunel ngrok para o Wokwi.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["tcp", "mosquitto:1883", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - mosquitto
