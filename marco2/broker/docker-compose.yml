# Broker MQTT do Marco 2 (autenticacao por usuario/senha + ACL) + tunel ngrok para o Wokwi.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ./passwd:/mosquitto/config/passwd:ro

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["tcp", "mosquitto:1883", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - mosquitto
