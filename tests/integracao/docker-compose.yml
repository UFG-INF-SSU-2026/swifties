# Ambiente dos testes de integração: broker real (mesma configuração, ACL e
# senhas de ../../broker) e TimescaleDB local. Portas deslocadas para não
# colidir com o ambiente de desenvolvimento. Credenciais apenas de teste.
#
# Os fixtures de tests/integracao/conftest.py sobem e derrubam este ambiente
# sozinhos; para inspecionar manualmente:
#   docker compose -f tests/integracao/docker-compose.yml -p swifties-it up -d
name: swifties-it

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "18830:1883"
      - "19001:9001"
    volumes:
      - ../../broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../../broker/acl:/mosquitto/config/acl:ro
      - ../../broker/passwd:/mosquitto/config/passwd:ro

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: swifties
      POSTGRES_PASSWORD: swifties-teste
      POSTGRES_DB: swifties
    ports:
      - "15432:5432"
    volumes:
      - dados:/var/lib/postgresql/data

volumes:
  dados:
